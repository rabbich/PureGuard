name: Build PureGuard Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Verify MobileNetV2 NSFW TFLite Model in Assets
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/nsfw.tflite ]; then
            echo "Downloading official MobileNetV2 nsfw_model release zip..."
            curl -L --retry 3 --fail \
              "https://github.com/GantMan/nsfw_model/releases/download/1.2.0/mobilenet_v2_140_224.1.zip" \
              -o /tmp/nsfw_model.zip
            unzip -p /tmp/nsfw_model.zip "mobilenet_v2_140_224/saved_model.tflite" > app/src/main/assets/nsfw.tflite
            rm -f /tmp/nsfw_model.zip
          fi
          ls -lh app/src/main/assets/nsfw.tflite

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureGuard-Sandbox-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
