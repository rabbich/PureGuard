name: Build PureGuard Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Download Quantized MobileNetV2 NSFW TFLite Model
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading open-source MobileNetV2 nsfw.tflite model..."
          curl -L --retry 3 --fail \
            "https://github.com/GantMan/nsfw_model/releases/download/1.2.0/nsfw_mobilenet_v2_140_224.1.tflite" \
            -o app/src/main/assets/nsfw.tflite || \
          curl -L --retry 3 --fail \
            "https://huggingface.co/spaces/Rxn19/nsfw-image-detection/resolve/main/nsfw.tflite" \
            -o app/src/main/assets/nsfw.tflite || \
          echo "Warning: Remote model mirror unavailable; NsfwClassifier will run in graceful text-only fallback mode."
          ls -lh app/src/main/assets/

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureGuard-Sandbox-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
